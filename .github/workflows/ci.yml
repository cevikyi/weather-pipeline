name: ci

on:

  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  dbt-compile:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ci_dummy
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7     # GitHub'ın resmi Python kurma adımı
      with:                             # adıma verilen ayarlar
        python-version: "3.10"          # lokal .venv'inle aynı sürüm
        cache: pip                      # indirilen paketleri sakla, sonraki çalıştırmada oradan al
    - name: Install dependincies
      run: pip install -r requirements.txt
    - name: dbt compile
      run: dbt compile



